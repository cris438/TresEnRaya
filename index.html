<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres en Raya</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container d-flex justify-content-center align-items-start flex-wrap">
        <h1 class="title text-center">Tres en Raya</h1>
        <div class="mt-5">
            <div class="contorno">
                <button class="btn" id="0"></button>
                <button class="btn" id="1"></button>
                <button class="btn" id="2"></button>
            </div>
            <div class="contorno">
                <button class="btn" id="3"></button>
                <button class="btn" id="4"></button>
                <button class="btn" id="5"></button>
            </div>
            <div class="contorno-ultimo">
                <button class="btn" id="6"></button>
                <button class="btn" id="7"></button>
                <button class="btn" id="8"></button>
            </div>
        </div>
        <div class="contenedor-reiniciar">
            <span class="turnos">Turno del jugador 1 (O)</span>
            <button class="btn btn-primary reiniciar">Reiniciar</button>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
